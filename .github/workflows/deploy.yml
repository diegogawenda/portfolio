name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # site.spec.js gates the pending build itself (via the local
      # webServer, before it's live). The full regression suite below
      # targets production directly (every spec hardcodes the live URL),
      # so it necessarily checks the site as of just before this deploy,
      # not the pending change — in practice near-identical for most
      # deploys, and self-corrects on the next run either way. Both steps
      # continue on failure so a test regression never blocks shipping;
      # the QA Lab panel just honestly reports whatever each run found.
      - name: Run pre-deploy QA suite (site.spec.js, against the local build)
        run: npx playwright test
        continue-on-error: true

      - name: Run full regression suite (against production, chromium only)
        run: npx playwright test -c playwright.ci-full.config.js
        continue-on-error: true

      - name: Merge both runs into one report
        run: |
          mkdir -p all-blobs
          cp blob-report-site/*.zip all-blobs/site.zip
          cp blob-report-full/*.zip all-blobs/full.zip
          npx playwright merge-reports --config=playwright.merge.config.js all-blobs

      - name: Generate QA summary
        run: node scripts/generate-qa-summary.js

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets _site/
          cp -r qa-report _site/
          cp qa-results.json _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
